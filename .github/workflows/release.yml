# Publish opencode-guildhall to npm with Trusted Publishing (OIDC): no npm token is stored anywhere,
# and every version carries provenance linking it to the commit it was built from.
#
# Release: bump packages/opencode-guildhall/package.json "version", commit, then
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Check (lint, typecheck, tests)
        run: bun run check

      - name: Tag matches the package version
        working-directory: packages/opencode-guildhall
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      # prepack builds the bundle (plugin, hub, hall) before packing.
      - name: Publish
        working-directory: packages/opencode-guildhall
        run: npm publish --provenance --access public
