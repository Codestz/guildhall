    <style>
      /* The loader's ink, not a sky colour: a canvas that is ever shown cleared (a resize clears it) then
         reads as a dark beat, never a white flash. */
      html, body, #root { margin: 0; height: 100%; background: #15110d; overflow: hidden; }
      /* The first paint, before any script: the loader's ink, crest and name at the loader's own
         place (hud/loader.css), so React takes over without a jump and the world is never seen bare. */
      #boot-shell { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
        gap: 18px; padding: clamp(72px, 26vh, 260px) 20px 24px; box-sizing: border-box; color: #f1d590;
        background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(220, 182, 98, 0.1), transparent 70%),
          radial-gradient(ellipse at 50% 45%, #241b13 0%, #15110d 55%, #0c0907 100%); }
      #boot-shell .crest { display: grid; place-items: center; width: 68px; height: 68px; border: 1px solid rgba(220, 182, 98, 0.34);
        border-radius: 50%; box-shadow: 0 0 40px -8px rgba(220, 182, 98, 0.35); }
      #boot-shell .crest svg { width: 40px; height: 40px; }
      #boot-shell .name { font: 400 clamp(40px, 8vw, 76px) / 1 "Marcellus SC", "Cormorant SC", Georgia, serif; letter-spacing: 0.08em; }
      @media (max-width: 640px) { #boot-shell { padding-top: clamp(64px, 22vh, 180px); }
        #boot-shell .crest { width: 56px; height: 56px; } #boot-shell .crest svg { width: 32px; height: 32px; } }
    </style>
  </head>
  <body>
    <div id="root">

        <span class="name">Guildhall</span>

    </div>
    <script type="module" src="/src/main.tsx"></script>
